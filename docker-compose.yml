name: lubao

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lubao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lubao}
      POSTGRES_DB: ${POSTGRES_DB:-lubao}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lubao} -d ${POSTGRES_DB:-lubao}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    user: root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lubao}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lubao_minio_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Задача 031, этап D — распознавание документов (OCR). Внутри docker-сети,
  # без published-порта: наружу не торчит, backend ходит по OCR_SERVICE_URL.
  # Не запущен — recognition.service.ts пишет DocumentRecognition.status=
  # SKIPPED и продолжает, ручная проверка документа админом не затрагивается.
  ocr:
    build:
      context: ./infra/ocr
    restart: unless-stopped
    expose:
      - "8000"

  # Расстояние по дороге между городами (047 п.2): свой OSRM, без внешних API.
  # Карта собирается на внешней машине (infra/osrm/prepare.sh) и копируется в volume osrm-data.
  # --mmap: полная карта ~8 ГБ, на Маке 8 ГБ RAM — читаем с диска по мере нужды (release.md п.2.6a). Пока её нет — ждёт, а
  # бэкенд показывает «—» и досчитывает планировщиком.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    command: ["sh", "-c", "while [ ! -f /data/region.osrm.hsgr ]; do echo 'osrm: нет карты в volume osrm-data — docs/release.md п.2.6a'; sleep 300; done; exec osrm-routed --algorithm ch --mmap --max-table-size 1000 /data/region.osrm"]
    volumes:
      - osrm-data:/data
    expose:
      - "5000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://lubao:lubao@postgres:5432/lubao?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: ${BACKEND_PORT:-3000}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-lubao}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-lubao_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-lubao-uploads}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      MOBIZON_API_KEY: ${MOBIZON_API_KEY:-}
      MOBIZON_API_URL: ${MOBIZON_API_URL:-https://api.mobizon.kz/service/message/sendsmsmessage}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_TEMPLATE: ${WHATSAPP_TEMPLATE:-}
      TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN:-}
      # Dev: без ключей WhatsApp/Telegram код пишется в лог — выбор канала виден на экране входа.
      LOGIN_CODE_CONSOLE_CHANNELS: ${LOGIN_CODE_CONSOLE_CHANNELS:-whatsapp,telegram}
      # Push (042 п.1): console — в лог; real — FCM. Ключ — файл в backend/secrets/ (в .gitignore).
      PUSH_PROVIDER: ${PUSH_PROVIDER:-console}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      IDENTIFIER_PEPPER: ${IDENTIFIER_PEPPER}
      IDENTIFIER_KEY: ${IDENTIFIER_KEY}
      OCR_SERVICE_URL: ${OCR_SERVICE_URL:-}
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
      # --mmap (Мак, 8 ГБ RAM): холодный маршрут до ~10 с — таймаут больше 5 с по умолчанию.
      OSRM_TIMEOUT_MS: ${OSRM_TIMEOUT_MS:-30000}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/site:/srv/site:ro
    ports:
      - "${NGINX_PORT:-80}:80"

volumes:
  # 049 п.11: имя без префикса проекта — в него копируется готовая карта.
  osrm-data:
    name: osrm-data
  pgdata:
  redisdata:
  miniodata:
