# Прод-окружение (задача 043, п.6). Отличия от docker-compose.yml (dev):
#  - Postgres, Redis, MinIO, OCR — только во внутренней сети (`internal: true`,
#    без портов наружу и без выхода в интернет);
#  - наружу торчит только nginx (80/443); TLS — Let's Encrypt (certbot);
#  - бэкенд собирается из Dockerfile.prod, миграции — при старте;
#  - обязательные секреты без значений по умолчанию (compose не стартует без них);
#  - ежедневные бэкапы БД и бакетов.
# Запуск и первый деплой — в docs/release.md; бэкапы и восстановление — infra/README.md.
name: lubao

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lubao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lubao}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lubao} -d ${POSTGRES_DB:-lubao}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?задайте REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    user: root
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?задайте MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?задайте MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  ocr:
    build:
      context: ./infra/ocr
    restart: unless-stopped
    networks: [internal]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lubao}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lubao}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OCR_SERVICE_URL: http://ocr:8000
    # internal — к БД/Redis/MinIO/OCR; edge — выход в интернет (SMS, почта, WhatsApp, курс НБ РК, перевод).
    networks: [internal, edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [backend]
    environment:
      APP_HOST: ${APP_HOST:?задайте APP_HOST (домен приложения)}
      # Адрес Tailscale-интерфейса сервера, на котором слушает админка (030): 100.x.y.z.
      ADMIN_LISTEN: ${ADMIN_LISTEN:?задайте ADMIN_LISTEN (например 100.64.0.1:8080)}
    volumes:
      - ./infra/nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./apps/lubao_app/build/web:/srv/app:ro
      - ./apps/lubao_admin/build/web:/srv/admin:ro
      - ./infra/site:/srv/site:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    networks: [edge, internal]

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks: [edge]
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

  # Ежедневные копии: БД (pg_dump) и бакеты MinIO. Хранятся в томе `backups`
  # (14 дней) и, если задан BACKUP_REMOTE_CMD, уходят в ОТДЕЛЬНОЕ хранилище.
  backup:
    build:
      context: ./infra/backup
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-lubao}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-lubao}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-22}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_REMOTE_CMD: ${BACKUP_REMOTE_CMD:-}
    volumes:
      - backups:/backups
    networks: [internal, edge]

volumes:
  pgdata:
  redisdata:
  miniodata:
  backups:
  certbot-www:
  letsencrypt:

networks:
  # Без выхода наружу: сюда подключены только БД, Redis, MinIO, OCR (+ бэкенд/nginx/backup).
  internal:
    internal: true
  edge:
