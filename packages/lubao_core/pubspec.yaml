name: lubao_core
description: "A new Flutter package project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.11.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  lucide_icons: ^0.257.0
  skeletonizer: ^3.0.0
  flutter_animate: ^4.5.2
  socket_io_client: ^3.1.6
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # Фирменный знак (design/brand, утверждён 2026-10-07).
  assets:
    - assets/brand/
    # Миниатюры типов кузова (045 п.4, design/brand/vehicles, эталон 29).
    - assets/vehicles/
    # Иконки нижнего меню (эталон 33, design/brand/nav).
    - assets/nav/

  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Variable.ttf
          weight: 400
        - asset: assets/fonts/Onest-Variable.ttf
          weight: 500
        - asset: assets/fonts/Onest-Variable.ttf
          weight: 600
        - asset: assets/fonts/Onest-Variable.ttf
          weight: 700
        - asset: assets/fonts/Onest-Variable.ttf
          weight: 800
    # Иероглифы без запросов к fonts.gstatic.com (020 часть А, 043 п.8):
    # Noto Sans SC, урезанный до GB 2312 ур.1 + символы app_zh.arb —
    # scripts/subset-noto-sc.py. Лицензия — assets/fonts/NotoSansSC-OFL.txt.
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Lubao.otf
